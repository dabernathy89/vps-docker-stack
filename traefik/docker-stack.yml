# docker-stack.yml (Expected path: traefik/docker-stack.yml)
# Deploys Traefik reverse proxy in Docker Swarm mode.
version: "3.8"

services:
  traefik:
    image: traefik:v3.0 # Use a specific, recent version of the official Traefik image
    ports:
      # Use host mode for ports 80/443 for performance and preserving client IP
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      # Mount Docker socket (read-only) for Swarm service discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount persistent storage for Let's Encrypt certificates
      # Path on VPS: /opt/traefik/letsencrypt (created by Ansible)
      - /opt/traefik/letsencrypt:/letsencrypt
      # Mount Traefik static configuration file (read-only)
      # The actual traefik.yml file (traefik/traefik.yml) should be in the same directory when deploying.
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      # Attach Traefik to the public network it will manage
      - traefik-public
    environment:
      # Pass Let's Encrypt email from .env file
      # The .env file (traefik/.env) should be present in the same directory when deploying.
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      # Optional: Set Traefik log level (DEBUG, INFO, WARNING, ERROR)
      # - TRAEFIK_LOG_LEVEL=DEBUG
    deploy:
      mode: replicated
      replicas: 1 # Usually only need one Traefik instance per manager node set
      placement:
        constraints: [node.role == manager] # Ensure Traefik runs on a manager node
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      labels:
        # --- Labels to expose Traefik dashboard itself via Traefik ---
        - "traefik.enable=true"
        # Explicitly tell Traefik which network its own service is on for dashboard routing
        - "traefik.docker.network=traefik-public"

        # --- Router for the Dashboard ---
        # Define how to access the dashboard (use a dedicated subdomain)
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.domain1.com`)" # CHANGE DOMAIN
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure" # Access via HTTPS
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=myresolver" # Use Let's Encrypt
        - "traefik.http.routers.traefik-dashboard.service=api@internal" # Use internal API service

        # --- Middleware for Dashboard Authentication (RECOMMENDED) ---
        # Uncomment and configure Basic Auth or another middleware for security
        # - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth"
        # Generate user:password hash using htpasswd:
        # echo $(htpasswd -nb admin YOUR_PASSWORD) | sed -e s/\\$/\\$\\$/g
        # - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$......"

# Define the overlay network used by Traefik and proxied services
networks:
  traefik-public:
    driver: overlay
    name: traefik-public # Explicitly name the network
    attachable: true # Allows non-swarm containers to connect if needed (optional)

# Note: The traefik.yml (traefik/traefik.yml) and .env (traefik/.env) files
# should be present in the same directory when running 'docker stack deploy'.

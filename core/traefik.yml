version: "3"

# traefik.yml (Static Configuration)
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard configuration
api:
  dashboard: false

# Define network entrypoints (HTTP and HTTPS)
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: myresolver

# Configure Certificate Resolvers (Let's Encrypt)
certificatesResolvers:
  myresolver:
    acme:
      email: daniel@danielabernathy.com
      storage: /etc/traefik/acme/acme.json
      httpChallenge:
        entryPoint: web

# Configure Service Discovery Providers (Docker Swarm)
providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-public

# Configure Logging
log:
  level: DEBUG

# Configure Access Logs
accessLog: {}

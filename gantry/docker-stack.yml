# docker-stack.yml (Expected path: gantry-stack/docker-stack.yml)
# Deploys Gantry container to monitor and update other Swarm services.
version: "3.8"

services:
  gantry:
    image: ghcr.io/shizunge/gantry:latest # Use the official Gantry image
    environment:
      # Provide registry credentials securely via environment variables
      # Gantry automatically detects DOCKER_USER/DOCKER_PASSWORD for registries
      # where pass_credentials_to_env is true in config.yml
      # These variables should be sourced from the .env file (gantry-stack/.env) when deploying.
      - DOCKER_USER=${GHCR_USER}
      - DOCKER_PASSWORD=${GHCR_PAT}
      # Set log level (optional, defaults to info)
      # - LOG_LEVEL=debug
    volumes:
      # Mount Docker socket to allow Gantry to interact with Swarm API
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only recommended
      # Mount the configuration file copied by Ansible
      # Source path on VPS: /opt/gantry/config/config.yml
      # Original source file path (local): ansible-vps-setup/gantry_config.yml
      - /opt/gantry/config/config.yml:/config/config.yml:ro # Mount config read-only
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager] # Gantry must run on a manager node
      restart_policy:
        condition: on-failure
# Note: The .env file (gantry-stack/.env) containing GHCR_USER and GHCR_PAT
# should be present in the same directory when running 'docker stack deploy'
# and its variables exported.

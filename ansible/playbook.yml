# playbook.yml (Expected path: ansible-vps-setup/playbook.yml)
# Configures the VPS with Docker Swarm and prepares for Gantry/Traefik.
- name: Configure VPS with Docker Swarm
  hosts: vps # Target hosts defined in your inventory file
  become: true # Most tasks require sudo privileges
  vars_files:
    - inventory # Load variables (like deploy_user) from inventory (ansible-vps-setup/inventory)

  roles:
    # Use a standard role to install Docker and add user to docker group
    - role: geerlingguy.docker
      vars:
        docker_users: # Add the user who will run remote docker commands
          - "{{ deploy_user }}"

  tasks:
    - name: Ensure Docker Swarm is initialized
      community.docker.docker_swarm:
        state: present
      register: swarm_state
      # Note: The Ansible host needs Docker SDK for Python: pip install docker

    # Optional: Display join tokens if Swarm was just initialized
    # - name: Get Swarm join tokens
    #   community.docker.docker_swarm_info:
    #   register: swarm_info
    #   when: swarm_state.changed
    # - name: Display worker join token
    #   debug: msg="Worker token: {{ swarm_info.swarm_facts.JoinTokens.Worker }}"
    #   when: swarm_state.changed
    # - name: Display manager join token
    #   debug: msg="Manager token: {{ swarm_info.swarm_facts.JoinTokens.Manager }}"
    #   when: swarm_state.changed

    - name: Create directories for Traefik persistent data
      ansible.builtin.file:
        path: "/opt/traefik/letsencrypt" # Directory for Let's Encrypt certs
        state: directory
        owner: root # Traefik container often runs as root
        group: root
        mode: "0700" # Restrict access, Traefik container needs write access

# docker-stack.yml (Expected path: frankenphp-app1/docker-stack.yml)
# Defines the first FrankenPHP application stack for Docker Swarm.
version: "3.8"

services:
  # Service name within this stack ('app')
  # Full Swarm service name will be <stack_name>_app (e.g., app1_app)
  app:
    # Specify the image built from your Dockerfile and pushed to GHCR
    # The Dockerfile (frankenphp-app1/Dockerfile) should be in the same directory or context when building.
    image: ghcr.io/YOUR_GITHUB_USERNAME/frankenphp-app1:latest # CHANGE THIS
    networks:
      # Connect this service to the external Traefik network
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1 # Start with one replica, scale as needed
      update_config:
        parallelism: 1 # Update one container at a time
        delay: 10s # Wait 10 seconds between updates
        order: start-first # Start new container before stopping old one
      restart_policy:
        condition: on-failure
      labels:
        # --- Traefik Integration Labels ---
        - "traefik.enable=true" # Expose this service through Traefik
        # Explicitly tell Traefik which network to use for this service
        - "traefik.docker.network=traefik-public"

        # --- Router Definition (How Traefik finds this service) ---
        # Rule based on the hostname. DNS for app1.domain1.com must point to VPS IP.
        - "traefik.http.routers.app1-router.rule=Host(`app1.domain1.com`)" # CHANGE DOMAIN
        - "traefik.http.routers.app1-router.entrypoints=websecure" # Use HTTPS entrypoint
        - "traefik.http.routers.app1-router.tls.certresolver=myresolver" # Use Let's Encrypt

        # --- Service Definition (Where Traefik sends traffic) ---
        # Direct traffic to the port the application listens on *inside* the container.
        # FrankenPHP default HTTP port is 80.
        - "traefik.http.services.app1-service.loadbalancer.server.port=80"

        # --- Gantry Integration (No Labels Needed) ---
        # Gantry identifies services to update based on its config.yml,
        # matching the Swarm service name (app1_app) and image name.

# Define networks used by this stack
networks:
  traefik-public:
    external: true # Specify that this network is defined elsewhere (in Traefik stack)
    name: traefik-public # Ensure the name matches the external network

# Note: The Dockerfile (frankenphp-app1/Dockerfile) and the public/index.php
# (frankenphp-app1/public/index.php) file should be structured
# correctly in the directory when building the image specified above.
